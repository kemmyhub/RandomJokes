<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Curated jokes and humor for developers, scientists, and thinkers. Powered by Cloudflare Edge." />
    <title>Random Jokes • Curated Humor at the Edge</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="styles.css?v=2.1" />
  </head>

  <body>
    <!-- Ambient Background Glows -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <!-- Application Shell -->
    <div class="app-layout">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">RandomJokes</span>
            <span class="edge-badge">
              <span class="status-dot"></span>
              Cloudflare Edge
            </span>
          </div>
        </div>

        <nav class="nav-actions">
          <button id="sound-toggle-btn" class="icon-btn" title="Toggle audio effects" aria-label="Toggle Sound">
            <svg id="sound-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg id="sound-icon-off" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="1" y1="1" x2="23" y2="23"></line>
              <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
              <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
              <line x1="12" y1="19" x2="12" y2="23"></line>
              <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
          </button>

          <button id="toggle-favorites-btn" class="nav-btn" aria-label="Open Favorites">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Saved</span>
            <span id="favorites-count-badge" class="badge">0</span>
          </button>

          <a href="https://github.com/kemmyhub/RandomJokes" target="_blank" rel="noopener noreferrer" class="icon-btn" title="View Source on GitHub">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
          </a>
        </nav>
      </header>

      <!-- Main Content Stage -->
      <main class="main-content">
        <!-- Category Filter Pills -->
        <section class="category-bar" aria-label="Filter joke categories">
          <button class="cat-pill active" data-category="all">
            <span>✨ All Jokes</span>
          </button>
          <button class="cat-pill" data-category="programming">
            <span>💻 Dev & Code</span>
          </button>
          <button class="cat-pill" data-category="science">
            <span>🔬 Science</span>
          </button>
          <button class="cat-pill" data-category="dad">
            <span>👔 Dad Humor</span>
          </button>
          <button class="cat-pill" data-category="general">
            <span>☕ General</span>
          </button>
        </section>

        <!-- The Hero Joke Showcase Card -->
        <section class="joke-stage">
          <div class="card-glow"></div>
          <div class="joke-card" id="joke-card">
            <!-- Card Header Meta -->
            <div class="card-meta">
              <div class="meta-left">
                <span id="joke-category-tag" class="category-tag">
                  <span class="tag-hash">#</span><span id="joke-category-text">programming</span>
                </span>
                <span id="joke-source-tag" class="source-tag">CURATED</span>
              </div>
              <div class="meta-actions">
                <button id="tts-btn" class="card-icon-btn" title="Read Aloud" aria-label="Read Joke Aloud">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  </svg>
                </button>
                <button id="copy-btn" class="card-icon-btn" title="Copy to Clipboard" aria-label="Copy Joke">
                  <svg id="copy-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <svg id="copy-check-icon" class="hidden text-emerald-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </button>
                <button id="share-btn" class="card-icon-btn" title="Share Joke" aria-label="Share Joke">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Card Body / Joke Content -->
            <div class="card-body">
              <!-- Loading Skeleton / Spinner -->
              <div id="loader" class="loader-container hidden">
                <div class="pulse-bar bar-1"></div>
                <div class="pulse-bar bar-2"></div>
                <div class="pulse-bar bar-3"></div>
              </div>

              <!-- Joke Text Render Area -->
              <div id="joke-content" class="joke-content">
                <blockquote id="joke-setup" class="joke-setup">
                  Loading joke from the edge...
                </blockquote>
                <div id="punchline-wrapper" class="punchline-wrapper hidden">
                  <div class="punchline-divider"></div>
                  <p id="joke-delivery" class="joke-delivery"></p>
                </div>
              </div>
            </div>

            <!-- Card Footer Controls -->
            <div class="card-footer">
              <div class="btn-group-primary">
                <button id="new-joke-btn" class="btn btn-primary" title="Press Space for next joke">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                  </svg>
                  <span>Next Joke</span>
                  <span class="key-hint">Space</span>
                </button>

                <button id="ai-joke-btn" class="btn btn-ai" title="Generate joke with OpenAI">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                  </svg>
                  <span>AI Spark</span>
                </button>
              </div>

              <div class="btn-group-secondary">
                <button id="favorite-btn" class="btn btn-favorite" aria-label="Save to favorites">
                  <svg id="heart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                  </svg>
                  <span id="favorite-btn-text">Save</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Keyboard Shortcut Helper Bar -->
        <footer class="footer-bar">
          <div class="kbd-shortcuts">
            <span class="kbd-item"><kbd>Space</kbd> Next</span>
            <span class="kbd-item"><kbd>F</kbd> Save</span>
            <span class="kbd-item"><kbd>C</kbd> Copy</span>
            <span class="kbd-item"><kbd>S</kbd> Speak</span>
          </div>
        </footer>
      </main>

      <!-- Favorites Slide-Over Drawer -->
      <aside id="favorites-drawer" class="drawer hidden" aria-label="Favorites Drawer">
        <div class="drawer-overlay" id="drawer-overlay"></div>
        <div class="drawer-content">
          <div class="drawer-header">
            <div class="drawer-title-group">
              <div class="drawer-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
              </div>
              <h2>Saved Collection</h2>
              <span id="drawer-count-badge" class="count-pill">0</span>
            </div>
            <button id="close-drawer-btn" class="icon-btn" aria-label="Close Drawer">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="drawer-actions-bar">
            <input type="text" id="favorites-search" class="search-input" placeholder="Search saved jokes..." />
            <button id="clear-favorites-btn" class="btn btn-outline-danger" title="Delete all saved jokes">
              Clear All
            </button>
          </div>

          <!-- Favorites List -->
          <div id="favorites-list" class="favorites-list">
            <!-- Dynamic Content -->
          </div>
        </div>
      </aside>

      <!-- Toast Notification Root -->
      <div id="toast-container" class="toast-container" aria-live="polite"></div>
    </div>

    <!-- Scripts -->
    <script src="script.js?v=2.1"></script>
  </body>
</html>
